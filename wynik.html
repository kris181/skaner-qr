<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wynik skanowania</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111827;
            font-family: Arial, sans-serif;
            color: white;
        }

        .container {
            width: 90%;
            max-width: 500px;
            padding: 35px;
            background: #1f2937;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        }

        .success {
            font-size: 60px;
        }

        h1 {
            margin-top: 10px;
        }

        .code {
            margin-top: 25px;
            padding: 20px;
            background: #111827;
            border-radius: 10px;
            word-break: break-all;
            color: #22c55e;
            font-size: 20px;
        }

        button {
            margin-top: 25px;
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            background: #22c55e;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #16a34a;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="success">?</div>

    <h1>Kod zeskanowany!</h1>

    <p>Odczytana wartoœæ:</p>

    <div class="code" id="code">
        £adowanie...
    </div>

    <button onclick="window.location.href='index.html'">
        Skanuj ponownie
    </button>

</div>

<script>

    // Pobranie wartoœci "kod" z adresu URL

    const params = new URLSearchParams(window.location.search);

    const code = params.get("kod");

    const codeElement = document.getElementById("code");

    if (code) {
        codeElement.textContent = code;
    } else {
        codeElement.textContent = "Brak danych";
    }

</script>

</body>
</html>
